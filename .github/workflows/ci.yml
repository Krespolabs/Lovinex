name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: LOVINEX/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: LOVINEX
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: LOVINEX
        run: pnpm test
      - name: Type-check application
        working-directory: LOVINEX
        run: pnpm typecheck
      - name: Build application
        working-directory: LOVINEX
        run: pnpm build
